<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suri Frey | Digitální Vzorkovna</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #000; --bg: #ffffff; --border: #ececec; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: #222; }
        header { padding: 40px 20px; text-align: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(255,255,255,0.95); z-index: 1000; backdrop-filter: blur(10px); }
        h1 { font-weight: 300; letter-spacing: 5px; margin: 0; font-size: 24px; text-transform: uppercase; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 100px 20px; }
        .collection-section { margin-top: 60px; }
        .collection-header { font-size: 22px; font-weight: 300; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; }
        .bag-row { display: grid; grid-template-columns: 1fr 1fr 120px; gap: 40px; padding: 30px 0; border-bottom: 1px solid var(--border); align-items: center; }
        
        .photo-wrapper { position: relative; width: 100%; aspect-ratio: 1/1; cursor: pointer; }
        .photo-container { width: 100%; height: 100%; background: #fdfdfd; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; border: 1px solid #f9f9f9; }
        .photo-container img { max-width: 100%; height: auto; transition: opacity 0.3s ease; }
        .photo-nav { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 10px; pointer-events: none; opacity: 0.8; }

        .info h3 { font-size: 18px; font-weight: 600; margin: 0 0 8px 0; }
        .price { font-size: 19px; color: #666; margin-bottom: 20px; font-weight: 300; }
        .colors { display: flex; gap: 12px; margin-top: 15px; flex-wrap: wrap; }
        .swatch { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #eee; cursor: pointer; transition: 0.2s; }
        .swatch.active { border-color: #000; box-shadow: 0 0 0 2px #fff, 0 0 0 3px #000; }
        .select-area { text-align: center; border-left: 1px solid var(--border); height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .cb-custom { width: 28px; height: 28px; cursor: pointer; accent-color: #000; }
        #summary-bar { position: fixed; bottom: 30px; right: 30px; background: #000; color: #fff; padding: 15px 35px; border-radius: 50px; display: none; align-items: center; gap: 20px; z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .btn-order { background: #fff; color: #000; border: none; padding: 10px 22px; border-radius: 20px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

<header>
    <h1>Digitální Vzorkovna</h1>
</header>

<div class="container" id="showroom"></div>

<div id="summary-bar">
    <span>Vybráno: <strong id="count">0</strong> ks</span>
    <button class="btn-order" onclick="alert('Poptávka uložena.')">POSLAT POPTÁVKU</button>
</div>

<script>
    const inventory = [
        // KOLEKCE 1 (Původní - krátké názvy)
        { c: "SFY Debby (Původní)", v: "13600", p: "1 399 Kč", b: ["100", "300", "420"], type: "old" },
        { c: "SFY Debby (Původní)", v: "13601", p: "1 599 Kč", b: ["100", "300", "420"], type: "old" },
        { c: "SFY Debby (Původní)", v: "13602", p: "1 450 Kč", b: ["100", "300", "420"], type: "old" },
        { c: "SFY Debby (Původní)", v: "13603", p: "1 299 Kč", b: ["100", "300", "420"], type: "old" },
        { c: "SFY Debby (Původní)", v: "13606", p: "1 650 Kč", b: ["100", "300", "420"], type: "old" },
        { c: "SFY Kolekce 141", v: "14140", p: "1 499 Kč", b: ["100", "300", "420"], type: "old" },
        { c: "SFY Kolekce 141", v: "14141", p: "1 550 Kč", b: ["100", "300", "420"], type: "old" },
        { c: "SFY Kolekce 141", v: "14144", p: "1 350 Kč", b: ["100", "300", "420"], type: "old" },
        { c: "SFY Kolekce 141", v: "14145", p: "1 450 Kč", b: ["100", "300", "420"], type: "old" },
        { c: "SFY Kolekce 141", v: "14146", p: "1 599 Kč", b: ["100", "300", "420"], type: "old" },

        // KOLEKCE 2 (Nová - dlouhé názvy s galerii)
        { c: "Nová Kolekce SURI", v: "17401", p: "1 499 Kč", b: ["100", "420", "900"], type: "new" },
        { c: "Nová Kolekce SURI", v: "17262", p: "1 299 Kč", b: ["400"], type: "new" },
        { c: "Nová Kolekce SURI", v: "17400", p: "1 350 Kč", b: ["420"], type: "new" },
        { c: "Nová Kolekce SURI", v: "17402", p: "1 450 Kč", b: ["420"], type: "new" },
        { c: "Nová Kolekce SURI", v: "17321", p: "1 650 Kč", b: ["600"], type: "new" },
        { c: "Nová Kolekce SURI", v: "17413", p: "1 599 Kč", b: ["700", "950"], type: "new" },
        { c: "Nová Kolekce SURI", v: "17451", p: "1 250 Kč", b: ["830"], type: "new" }
    ];

    const colorsMap = { "100": "#000", "300": "#D2B48C", "400": "#F5F5DC", "420": "#8B864E", "600": "#800000", "700": "#A52A2A", "830": "#D3D3D3", "900": "#555", "950": "#222" };

    function getImgName(bag, barva, index = 1) {
        if (bag.type === "old") {
            return `${bag.v}_${barva}.jpg`;
        } else {
            const suffix = index === 1 ? "" : `_${index}`;
            return `SURI-FREY_${barva}_${bag.v},${barva}${suffix}.jpg`;
        }
    }

    function init() {
        const showroom = document.getElementById('showroom');
        const groups = {};
        inventory.forEach(item => {
            if (!groups[item.c]) groups[item.c] = [];
            groups[item.c].push(item);
        });

        for (const cat in groups) {
            let html = `<section class="collection-section"><h2 class="collection-header">${cat}</h2>`;
            groups[cat].forEach(bag => {
                const firstColor = bag.b[0];
                html += `
                <div class="bag-row">
                    <div class="photo-wrapper" onclick="nextPhoto('${bag.v}')">
                        <div class="photo-container">
                            <img id="img-${bag.v}" src="${getImgName(bag, firstColor)}" data-index="1" data-vzor="${bag.v}" data-barva="${firstColor}">
                        </div>
                        ${bag.type === 'new' ? '<div class="photo-nav">Klikněte pro další pohled</div>' : ''}
                    </div>
                    <div class="info">
                        <h3>Model ${bag.v}</h3>
                        <div class="price">${bag.p}</div>
                        <div class="colors">
                            ${bag.b.map((color, i) => `
                                <div class="swatch ${i===0?'active':''}" 
                                     style="background: ${colorsMap[color] || '#ccc'}" 
                                     onclick="changeVar('${bag.v}', '${color}', this)">
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="select-area">
                        <input type="checkbox" class="cb-custom" onchange="refreshCount()">
                    </div>
                </div>`;
            });
            html += `</section>`;
            showroom.innerHTML += html;
        }
    }

    function changeVar(vzor, barva, el) {
        const bag = inventory.find(i => i.v === vzor);
        const img = document.getElementById(`img-${vzor}`);
        img.src = getImgName(bag, barva, 1);
        img.dataset.index = 1;
        img.dataset.barva = barva;
        el.parentElement.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        el.classList.add('active');
    }

    function nextPhoto(vzor) {
        const bag = inventory.find(i => i.v === vzor);
        if (bag.type === "old") return;
        const img = document.getElementById(`img-${vzor}`);
        let currentIndex = parseInt(img.dataset.index);
        currentIndex = currentIndex >= 5 ? 1 : currentIndex + 1;
        const nextSrc = getImgName(bag, img.dataset.barva, currentIndex);
        const temp = new Image();
        temp.onload = () => { img.src = nextSrc; img.dataset.index = currentIndex; };
        temp.onerror = () => { if(currentIndex !== 1) nextPhoto(vzor); };
        temp.src = nextSrc;
    }

    function refreshCount() {
        const count = document.querySelectorAll('.cb-custom:checked').length;
        document.getElementById('count').innerText = count;
        document.getElementById('summary-bar').style.display = count > 0 ? 'flex' : 'none';
    }

    init();
</script>
</body>
</html>
