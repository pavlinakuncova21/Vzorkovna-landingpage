<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitální Vzorkovna | SURI FREY</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #000; --bg: #fff; --grey: #f8f8f8; --border: #eee; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: #1a1a1a; line-height: 1.6; }
        
        #login-overlay { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
        .login-box { text-align: center; max-width: 300px; width: 100%; }
        .login-box h1 { font-weight: 200; letter-spacing: 3px; font-size: 18px; margin-bottom: 30px; }
        .login-box input { width: 100%; padding: 15px; border: 1px solid #000; margin-bottom: 20px; outline: none; text-align: center; letter-spacing: 5px; }
        .login-box button { background: #000; color: #fff; border: none; padding: 15px 40px; cursor: pointer; width: 100%; letter-spacing: 2px; font-weight: 600; }

        header { padding: 40px 20px; text-align: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: #fff; z-index: 100; }
        h1 { font-weight: 200; letter-spacing: 8px; text-transform: uppercase; margin-bottom: 30px; font-size: 22px; }
        .brand-nav { display: flex; justify-content: center; gap: 40px; }
        .brand-nav button { background: none; border: none; cursor: pointer; font-size: 13px; letter-spacing: 2px; opacity: 0.3; transition: 0.3s; padding-bottom: 5px; }
        .brand-nav button.active { opacity: 1; border-bottom: 1px solid #000; }

        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        .collection-block { margin-bottom: 80px; }
        .collection-title { font-weight: 200; font-size: 26px; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 40px; letter-spacing: 3px; text-transform: uppercase; }
        
        .bag-row { display: grid; grid-template-columns: 1.2fr 1fr 100px; gap: 60px; padding: 40px 0; border-bottom: 1px solid var(--border); align-items: center; }
        
        .carousel { position: relative; width: 100%; aspect-ratio: 1/1; background: var(--grey); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .carousel img { max-width: 100%; height: auto; transition: 0.4s; }
        .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 24px; cursor: pointer; padding: 20px; opacity: 0.3; transition: 0.3s; z-index: 5; }
        .carousel-btn:hover { opacity: 1; background: rgba(255,255,255,0.5); }
        .prev { left: 0; } .next { right: 0; }
        .img-counter { position: absolute; bottom: 20px; font-size: 10px; letter-spacing: 2px; color: #999; }

        .info h2 { font-weight: 600; font-size: 20px; margin: 0 0 10px 0; }
        .price { font-size: 18px; font-weight: 200; margin-bottom: 30px; }
        .colors { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .swatch { width: 35px; height: 35px; border-radius: 50%; border: 1px solid #eee; cursor: pointer; transition: 0.2s; position: relative; }
        .swatch.active::after { content: ''; position: absolute; inset: -4px; border: 1px solid #000; border-radius: 50%; }

        .select-box { display: flex; justify-content: center; }
        .cb-container { position: relative; width: 40px; height: 40px; cursor: pointer; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; }
        .cb-container input { display: none; }
        .cb-container .checkmark { width: 20px; height: 20px; background: transparent; transition: 0.3s; border: 1px solid #eee; }
        .cb-container input:checked + .checkmark { background: #000; border-color: #000; }

        #summary-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #000; color: #fff; padding: 25px; transform: translateY(100%); transition: 0.5s; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        #summary-bar.visible { transform: translateY(0); }
        .order-btn { background: #fff; color: #000; border: none; padding: 12px 30px; cursor: pointer; font-weight: 600; letter-spacing: 1px; }

        @media (max-width: 900px) {
            .bag-row { grid-template-columns: 1fr; gap: 30px; }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h1>VSTUP DO VZORKOVNY</h1>
        <input type="password" id="pass" placeholder="HESLO">
        <button onclick="checkLogin()">VSTOUPIT</button>
    </div>
</div>

<header>
    <h1>Digitální Vzorkovna</h1>
    <div class="brand-nav">
        <button onclick="changeBrand('Tamaris')" id="btn-Tamaris">TAMARIS</button>
        <button onclick="changeBrand('Suri Frey')" id="btn-Suri Frey" class="active">SURI FREY</button>
        <button onclick="changeBrand('Emily & Noah')" id="btn-Emily & Noah">EMILY & NOAH</button>
    </div>
</header>

<div class="container" id="main-content"></div>

<div id="summary-bar">
    <div>VYBRÁNO: <span id="count">0</span> položek</div>
    <button class="order-btn" onclick="sendOrder()">ODESLAT POPTÁVKU</button>
</div>

<script>
    const APP_PASSWORD = "SURI2026";

    // TADY JSOU TEĎ ÚPLNĚ VŠECHNY KOLEKCE Z EXCELU/SCREENŮ
    const inventory = [
        // KOLEKCE 136
        { brand: "Suri Frey", collection: "Debby (136)", vzor: "13600", price: "1 399 Kč", colors: ["100", "300", "420"], type: "old" },
        { brand: "Suri Frey", collection: "Debby (136)", vzor: "13601", price: "1 599 Kč", colors: ["100", "300", "420"], type: "old" },
        { brand: "Suri Frey", collection: "Debby (136)", vzor: "13602", price: "1 450 Kč", colors: ["100", "300", "420"], type: "old" },
        { brand: "Suri Frey", collection: "Debby (136)", vzor: "13603", price: "1 299 Kč", colors: ["100", "300", "420"], type: "old" },
        { brand: "Suri Frey", collection: "Debby (136)", vzor: "13606", price: "1 650 Kč", colors: ["100", "300", "420"], type: "old" },
        
        // KOLEKCE 141
        { brand: "Suri Frey", collection: "Kolekce 141", vzor: "14140", price: "1 499 Kč", colors: ["100", "300", "420"], type: "old" },
        { brand: "Suri Frey", collection: "Kolekce 141", vzor: "14141", price: "1 550 Kč", colors: ["100", "300", "420"], type: "old" },
        { brand: "Suri Frey", collection: "Kolekce 141", vzor: "14144", price: "1 350 Kč", colors: ["100", "300", "420"], type: "old" },
        { brand: "Suri Frey", collection: "Kolekce 141", vzor: "14145", price: "1 450 Kč", colors: ["100", "300", "420"], type: "old" },
        { brand: "Suri Frey", collection: "Kolekce 141", vzor: "14146", price: "1 599 Kč", colors: ["100", "300", "420"], type: "old" },

        // NOVÁ KOLEKCE (S carouselem a dlouhými názvy)
        { brand: "Suri Frey", collection: "Nová Kolekce SURI", vzor: "17401", price: "1 499 Kč", colors: ["100", "420", "900", "950"], type: "new" },
        { brand: "Suri Frey", collection: "Nová Kolekce SURI", vzor: "17262", price: "1 299 Kč", colors: ["400"], type: "new" },
        { brand: "Suri Frey", collection: "Nová Kolekce SURI", vzor: "17400", price: "1 350 Kč", colors: ["420"], type: "new" },
        { brand: "Suri Frey", collection: "Nová Kolekce SURI", vzor: "17402", price: "1 450 Kč", colors: ["420"], type: "new" },
        { brand: "Suri Frey", collection: "Nová Kolekce SURI", vzor: "17405", price: "1 450 Kč", colors: ["420"], type: "new" },
        { brand: "Suri Frey", collection: "Nová Kolekce SURI", vzor: "17406", price: "1 550 Kč", colors: ["420"], type: "new" },
        { brand: "Suri Frey", collection: "Nová Kolekce SURI", vzor: "17408", price: "1 650 Kč", colors: ["420"], type: "new" },
        { brand: "Suri Frey", collection: "Nová Kolekce SURI", vzor: "17321", price: "1 650 Kč", colors: ["600"], type: "new" },
        { brand: "Suri Frey", collection: "Nová Kolekce SURI", vzor: "17413", price: "1 599 Kč", colors: ["700", "950"], type: "new" },
        { brand: "Suri Frey", collection: "Nová Kolekce SURI", vzor: "17510", price: "1 450 Kč", colors: ["700"], type: "new" },
        { brand: "Suri Frey", collection: "Nová Kolekce SURI", vzor: "17451", price: "1 250 Kč", colors: ["830"], type: "new" },
        { brand: "Suri Frey", collection: "Nová Kolekce SURI", vzor: "17382", price: "1 399 Kč", colors: ["900"], type: "new" },
        { brand: "Suri Frey", collection: "Nová Kolekce SURI", vzor: "17385", price: "1 499 Kč", colors: ["900"], type: "new" },
        { brand: "Suri Frey", collection: "Nová Kolekce SURI", vzor: "17261", price: "1 199 Kč", colors: ["950"], type: "new" }
    ];

    const colorsMap = { 
        "100": "#000", "300": "#D2B48C", "400": "#F5F5DC", 
        "420": "#8B864E", "600": "#800000", "700": "#A52A2A", 
        "830": "#D3D3D3", "900": "#555", "950": "#222" 
    };

    let selectedItems = JSON.parse(localStorage.getItem('vzorkovna_selection')) || {};
    let currentBrand = "Suri Frey";

    function checkLogin() {
        if(document.getElementById('pass').value.toUpperCase() === APP_PASSWORD) { 
            document.getElementById('login-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('login-overlay').remove(), 500);
        } else { alert('Chybné heslo.'); }
    }

    function changeBrand(brand) {
        currentBrand = brand;
        document.querySelectorAll('.brand-nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + brand).classList.add('active');
        render();
    }

    function getImgPath(bag, color, index) {
        if(bag.type === "old") return `${bag.vzor}_${color}.jpg`;
        const suffix = index === 1 ? "" : `_${index}`;
        return `SURI-FREY_${color}_${bag.vzor},${color}${suffix}.jpg`;
    }

    function render() {
        const container = document.getElementById('main-content');
        container.innerHTML = '';
        const filtered = inventory.filter(i => i.brand === currentBrand);
        const groups = [...new Set(filtered.map(i => i.collection))];

        groups.forEach(colName => {
            let section = `<div class="collection-block"><h2 class="collection-title">${colName}</h2>`;
            filtered.filter(i => i.collection === colName).forEach(bag => {
                const color = bag.activeColor || bag.colors[0];
                const imgIndex = bag.activeImgIndex || 1;
                const id = `${bag.vzor}_${color}`;
                const isChecked = selectedItems[id] ? 'checked' : '';

                section += `
                <div class="bag-row">
                    <div class="carousel">
                        <button class="carousel-btn prev" onclick="moveImg('${bag.vzor}', -1)">‹</button>
                        <img src="${getImgPath(bag, color, imgIndex)}" id="img-${bag.vzor}" onerror="this.src='https://via.placeholder.com/600?text=Foto+nenalezeno'">
                        <button class="carousel-btn next" onclick="moveImg('${bag.vzor}', 1)">›</button>
                        <div class="img-counter">POHLED ${imgIndex}</div>
                    </div>
                    <div class="info">
                        <h2>Vzor ${bag.vzor}</h2>
                        <div class="price">${bag.price}</div>
                        <div class="colors">
                            ${bag.colors.map(c => `
                                <div class="swatch ${c === color ? 'active' : ''}" 
                                     style="background:${colorsMap[c] || '#ccc'}" 
                                     onclick="changeColor('${bag.vzor}', '${c}')"></div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="select-box">
                        <label class="cb-container">
                            <input type="checkbox" id="cb-${bag.vzor}" onchange="toggleSelect('${bag.vzor}', '${color}')" ${isChecked}>
                            <span class="checkmark"></span>
                        </label>
                    </div>
                </div>`;
            });
            section += `</div>`;
            container.innerHTML += section;
        });
        updateSummary();
    }

    function changeColor(vzor, color) {
        const bag = inventory.find(i => i.vzor === vzor);
        bag.activeColor = color;
        bag.activeImgIndex = 1;
        document.getElementById(`cb-${vzor}`).checked = false;
        render();
    }

    function moveImg(vzor, dir) {
        const bag = inventory.find(i => i.vzor === vzor);
        if(!bag.activeImgIndex) bag.activeImgIndex = 1;
        bag.activeImgIndex += dir;
        if(bag.activeImgIndex < 1) bag.activeImgIndex = 5; 
        if(bag.activeImgIndex > 5) bag.activeImgIndex = 1;
        render();
    }

    function toggleSelect(vzor, color) {
        const id = `${vzor}_${color}`;
        if(document.getElementById(`cb-${vzor}`).checked) { selectedItems[id] = true; } 
        else { delete selectedItems[id]; }
        localStorage.setItem('vzorkovna_selection', JSON.stringify(selectedItems));
        updateSummary();
    }

    function updateSummary() {
        const count = Object.keys(selectedItems).length;
        document.getElementById('count').innerText = count;
        document.getElementById('summary-bar').classList.toggle('visible', count > 0);
    }

    function sendOrder() { alert("Poptávka vytvořena."); }

    render();
</script>
</body>
</html>
